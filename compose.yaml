
name: hablar

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  api:
    image: ${API_IMAGE:-ghcr.io/siddort/hablar-api:main}
    platform: linux/amd64
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      PORT: "8080"
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/siddort/hablar-website:main}
    platform: linux/amd64
    environment:
      API_UPSTREAM: http://api:8080
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    ports:
      - "80:8081"
      - "443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/www/habler.co.in/deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
