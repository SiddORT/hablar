services:
  api:
    image: ${SMOKE_IMAGE_PREFIX:?Run scripts/container-smoke.sh}-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    environment: !override
      DATABASE_URL: "postgresql://smoke:smoke-only-not-production@smoke-db:5432/smoke?sslmode=disable"
      SESSION_SECRET: "disposable-ci-only-key-not-for-real-data-0123456789"
      PORT: "8080"
      FORWARDED_ALLOW_IPS: "*"
    depends_on: !override
      smoke-db:
        condition: service_healthy
    ports: []
  
  website:
    image: ${SMOKE_IMAGE_PREFIX:?Run scripts/container-smoke.sh}-website:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/website.Dockerfile
      target: runtime
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-18080}:8080"
    volumes: !override
      - ./docker/nginx.smoke.conf.template:/etc/nginx/templates/default.conf.template:ro
  
  smoke-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke-only-not-production
      POSTGRES_DB: smoke
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d smoke"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - backend